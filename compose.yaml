services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportbridge}
      POSTGRES_USER: ${POSTGRES_USER:-sportbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportbridge_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sportbridge_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sportbridge_postgres_data:
